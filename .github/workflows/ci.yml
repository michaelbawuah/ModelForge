name: CI

on:
  push:
    branches:
      - main
      - "bulk/**"
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: modelforge
          MYSQL_USER: modelforge
          MYSQL_PASSWORD: modelforge_dev
          MYSQL_ROOT_PASSWORD: modelforge_root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pmodelforge_root_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://modelforge:modelforge_dev@127.0.0.1:3306/modelforge
      MODEL_ARTIFACT_ROOT: ${{ github.workspace }}/.modelforge/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/go-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go-runtime/go.mod
          cache-dependency-path: runtimes/go-runtime/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  containers:
    runs-on: ubuntu-latest
    needs:
      - python
      - go
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build platform images
        run: docker compose build api go-runtime
