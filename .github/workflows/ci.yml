name: CI

on:
  push:
    branches:
      - main
      - "bulk/**"
  pull_request:


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: modelforge
          MYSQL_USER: modelforge
          MYSQL_PASSWORD: modelforge_dev
          MYSQL_ROOT_PASSWORD: modelforge_root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pmodelforge_root_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://modelforge:modelforge_dev@127.0.0.1:3306/modelforge
      MODEL_ARTIFACT_ROOT: ${{ github.workspace }}/.modelforge/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python package
        run: python -m pip install -e ".[dev,pytorch,onnx,cloud]"
      - name: Validate production preflight
        env:
          MODELFORGE_ENV: production
          DATABASE_URL: mysql+pymysql://ci:secret@db.internal:3306/modelforge
          MODEL_ARTIFACT_BACKEND: s3
          MODEL_ARTIFACT_S3_BUCKET: modelforge-ci
          MODELFORGE_AUTH_MODE: oidc
          MODELFORGE_OIDC_ISSUER: https://identity.example.test/
          MODELFORGE_OIDC_AUDIENCE: https://modelforge.example.test
          MODELFORGE_OIDC_JWKS_URL: https://identity.example.test/jwks.json
          MODELFORGE_OIDC_AUTHORIZATION_URL: https://identity.example.test/authorize
          MODELFORGE_OIDC_TOKEN_URL: https://identity.example.test/token
          MODELFORGE_OIDC_CLIENT_ID: modelforge-ci
          MODELFORGE_OIDC_REDIRECT_URI: https://modelforge.example.test/auth/callback
          MODELFORGE_PUBLIC_BASE_URL: https://modelforge.example.test
          MODELFORGE_SESSION_COOKIE_SECURE: "true"
          MODELFORGE_TRUSTED_HOSTS: modelforge.example.test
          MODELFORGE_METRICS_TOKEN: ci-metrics-token
          MODELFORGE_RUNTIME_TOKEN: ci-runtime-token
          MODELFORGE_EXTERNAL_RUNTIMES: >-
            {"future-framework":{"name":"future-runtime","base_url":"http://runtime.internal:9000","auth_token_env":"MODELFORGE_RUNTIME_TOKEN"}}
        run: modelforge config-check > production-config.json
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Lint
        run: |
          python -m ruff check .
          node --check src/modelforge/dashboard/dashboard.js
      - name: Test
        run: python -m pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform -chdir=infra/aws fmt -check -diff -recursive
      - name: Initialize Terraform
        run: terraform -chdir=infra/aws init -backend=false
      - name: Validate Terraform
        run: terraform -chdir=infra/aws validate

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/go-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtimes/go-runtime/go.mod
          cache-dependency-path: runtimes/go-runtime/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  containers:
    runs-on: ubuntu-latest
    needs:
      - python
      - go
      - terraform
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build platform images
        run: docker compose build api go-runtime


  benchmark-smoke:
    runs-on: ubuntu-latest
    needs:
      - containers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark client
        run: python -m pip install -e .
      - name: Start ModelForge stack
        run: docker compose up --build --wait --detach
      - name: Smoke test installed CLI
        run: modelforge status > cli-status.json
      - name: Smoke test public product
        run: |
          python - <<'PY'
          import json
          import httpx

          landing = httpx.get("http://127.0.0.1:8000/", timeout=10)
          landing.raise_for_status()
          assert "Deploy any model." in landing.text
          open("landing-smoke.html", "w", encoding="utf-8").write(landing.text)

          dashboard = httpx.get("http://127.0.0.1:8000/dashboard", timeout=10)
          dashboard.raise_for_status()
          assert "Production overview" in dashboard.text
          assert "API keys" in dashboard.text
          open("dashboard-smoke.html", "w", encoding="utf-8").write(dashboard.text)

          auth = httpx.get("http://127.0.0.1:8000/auth/config", timeout=10)
          auth.raise_for_status()
          payload = auth.json()
          assert payload["mode"] == "disabled"
          open("auth-config.json", "w", encoding="utf-8").write(
              json.dumps(payload, indent=2)
          )
          PY
      - name: Seed stable and canary product demo
        run: >-
          python demo/bootstrap_demo.py
          --environment ci-demo
          --weight 20
          > demo-bootstrap.json
      - name: Exercise CLI against seeded demo
        run: |
          modelforge deployments --environment ci-demo > cli-deployments.json
          modelforge predict ci-demo 10 > cli-prediction.json
      - name: Bootstrap external benchmark deployment
        run: >-
          python benchmarks/bootstrap_external.py
          --environment ci-benchmark
          --output benchmark-bootstrap.json
      - name: Run benchmark smoke test
        run: >-
          python benchmarks/load_test.py
          --environment ci-benchmark
          --requests 200
          --concurrency 20
          --warmup 20
          --output benchmark-results.json
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modelforge-benchmark-smoke
          path: |
            benchmark-bootstrap.json
            benchmark-results.json
            cli-status.json
            cli-deployments.json
            cli-prediction.json
            demo-bootstrap.json
            landing-smoke.html
            dashboard-smoke.html
            auth-config.json
            compose.log
          if-no-files-found: ignore
      - name: Stop ModelForge stack
        if: always()
        run: docker compose down --volumes
