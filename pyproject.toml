[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge"
version = "0.1.0"
description = "A developer-focused, reliability-aware ML deployment platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
pytorch = [
    "numpy>=1.26",
    "torch>=2.4",
]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
\n[tool.setuptools.package-data]\n"modelforge.dashboard" = ["*.html"]\n